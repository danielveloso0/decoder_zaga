[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hurdle-gamma-copula"
version = "0.1.0"
description = "Pretrained Hurdle-Gamma VAE with a Gaussian copula for log-normalized single-cell expression"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "scipy>=1.13,<2", "anndata>=0.11,<1", "pandas>=2.2,<4", "h5py>=3.10,<4", "scikit-learn>=1.4,<2", "threadpoolctl>=3,<4"]

[tool.setuptools.packages.find]
include = ["hurdle_gamma_copula*"]

[tool.setuptools.package-data]
hurdle_gamma_copula = ["assets/*"]
